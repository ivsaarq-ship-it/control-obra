<script>// id: acceso.reglas · tipo: regla_calculo · módulo: acceso · deps: acceso.servicio
// Estados: 'fuera' (sin sesión) → passkey o enlace por correo.
//          'bloqueada' (hay sesión pero la app se bloqueó) → passkey o PIN.
//          'dentro' → se ve la app. Ninguna pantalla sin 'dentro'.
(function (raiz) {
  function crearAcceso(sb, opciones) {
    const o = Object.assign({ minutosBloqueo: 10, ahora: () => Date.now() }, opciones || {});
    let estado = 'fuera', ultimoUso = 0, metodo = '';
    const escuchas = [];
    const poner = (e) => { estado = e; if (e === 'dentro') ultimoUso = o.ahora(); escuchas.forEach((f) => f(e)); };
    const error = (e, porDefecto) => ({ ok: false, mensaje: (e && e.message) || porDefecto });

    return {
      estado: () => estado,
      metodo: () => metodo,
      alCambiar: (f) => escuchas.push(f),
      puedeVer: () => estado === 'dentro',

      // urlActual: si viene del enlace del correo, entra directo.
      async iniciar(urlActual) {
        const vieneDeEnlace = /access_token=|[?&]code=/.test(urlActual || '');
        const { data } = await sb.auth.getSession();
        const haySesion = !!(data && data.session);
        let conQueDesbloquear = true;
        if (haySesion && !vieneDeEnlace && sb.auth.passkey && sb.auth.passkey.list) {
          // Sin huella registrada no hay con qué desbloquear: entra para que pueda configurarla.
          try { const r = await sb.auth.passkey.list(); conQueDesbloquear = !!(r && r.data && r.data.length); } catch (e) { conQueDesbloquear = true; }
        }
        metodo = vieneDeEnlace ? 'correo' : 'sesión guardada';
        poner(haySesion ? (vieneDeEnlace || !conQueDesbloquear ? 'dentro' : 'bloqueada') : 'fuera'); // con sesión guardada pide huella o PIN
        sb.auth.onAuthStateChange((ev, ses) => { if (!ses) poner('fuera'); });
        return estado;
      },

      async entrarConPasskey() {
        const { data, error: e } = await sb.auth.signInWithPasskey();
        if (e || !data || !data.session) return error(e, 'No se pudo entrar con huella/Face ID');
        metodo = 'huella'; poner('dentro'); return { ok: true };
      },

      async enviarEnlace(correo) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo || '')) return { ok: false, mensaje: 'Correo no válido' };
        const { error: e } = await sb.auth.signInWithOtp({
          email: correo, options: { shouldCreateUser: false, emailRedirectTo: raiz.location ? raiz.location.href.split('#')[0] : undefined },
        });
        return e ? error(e, 'No se pudo enviar el enlace') : { ok: true, mensaje: 'Revisa tu correo' };
      },

      async entrarConPin(pin) {
        if (estado !== 'bloqueada') return { ok: false, mensaje: 'El PIN solo desbloquea; primero entra con huella o correo' };
        if (!/^\d{6}$/.test(pin || '')) return { ok: false, mensaje: 'El PIN tiene 6 dígitos' };
        const { data, error: e } = await sb.rpc('verificar_pin', { p_pin: pin });
        if (e) return error(e, 'Error al verificar PIN');
        if (data.ok) { metodo = 'PIN'; poner('dentro'); return { ok: true }; }
        if (data.motivo === 'bloqueado') return { ok: false, mensaje: 'Bloqueado 15 min por 5 intentos fallidos' };
        if (data.motivo === 'sin_pin') return { ok: false, mensaje: 'No tienes PIN configurado' };
        return { ok: false, mensaje: `PIN incorrecto. Quedan ${data.restantes} intentos` };
      },

      async contarPasskeys() {
        try { const r = await sb.auth.passkey.list(); return r && r.data ? r.data.length : null; } catch (e) { return null; }
      },

      async registrarPasskey() {
        if (estado !== 'dentro') return { ok: false, mensaje: 'Primero entra' };
        try {
          const { error: e } = await sb.auth.registerPasskey();
          return e ? error(e, 'No se pudo registrar') : { ok: true };
        } catch (e) { return error(e, 'No se pudo registrar'); }
      },

      async fijarPin(pin) {
        if (estado !== 'dentro') return { ok: false, mensaje: 'Primero entra' };
        if (!/^\d{6}$/.test(pin || '')) return { ok: false, mensaje: 'El PIN tiene 6 dígitos' };
        const { error: e } = await sb.rpc('fijar_pin', { p_pin: pin });
        return e ? error(e, 'No se pudo guardar el PIN') : { ok: true };
      },

      // Llamar en cada interacción; si pasó el tiempo, bloquea.
      revisarInactividad() {
        if (estado === 'dentro' && o.ahora() - ultimoUso > o.minutosBloqueo * 60000) poner('bloqueada');
        else if (estado === 'dentro') ultimoUso = o.ahora();
        return estado;
      },

      bloquear() { if (estado === 'dentro') poner('bloqueada'); },
      // Sale siempre en pantalla, aunque el servidor tarde o falle; borra la sesión guardada del teléfono.
      async salir() {
        metodo = ''; poner('fuera');
        try { await Promise.race([sb.auth.signOut({ scope: 'local' }), new Promise((r) => setTimeout(r, 3000))]); } catch (e) { /* ya está fuera */ }
        try { const ls = raiz.localStorage; if (ls) Object.keys(ls).filter((k) => k.startsWith('sb-')).forEach((k) => ls.removeItem(k)); } catch (e) { /* sin almacenamiento */ }
      },
    };
  }
  if (typeof module !== 'undefined') module.exports = { crearAcceso }; else raiz.crearAcceso = crearAcceso;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// id: ui.ayudas · tipo: componente_comun · módulo: ui · deps: ninguna
// Construye elementos sin innerHTML (los textos del usuario nunca se interpretan como código).
(function (raiz) {
  function h(tag, attrs, ...hijos) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k in el && k !== 'list') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of hijos.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }
  const num = (x) => Number(x || 0);
  const dinero = (x) => '$' + num(x).toLocaleString('es-MX', { maximumFractionDigits: 0 });
  const corto = (x) => { x = num(x); return x >= 1e6 ? (x / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(x)); };
  const pct = (x) => (x === null || x === undefined ? '—' : Math.round(num(x)) + '%');
  const hoy = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fechaCorta = (iso) => { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }); };
  const lunes = (iso) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
  const masDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
  const barra = (valor, clase) => h('div', { class: 'bar ' + (clase || '') }, h('i', { style: 'width:' + Math.max(0, Math.min(100, num(valor))) + '%' }));
  const nombreConcepto = (c) => (c ? (c.clave ? c.clave + ' ' : '') + c.concepto : 'Sin concepto');
  function aviso(texto) {
    const a = h('div', { class: 'aviso', role: 'status' }, texto); document.body.append(a);
    setTimeout(() => a.remove(), 2500);
  }
  const ICONOS = {
    inicio: 'M3 11l9-8 9 8M5 10v10h14V10', conceptos: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
    gastos: 'M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6', avance: 'M3 17l6-6 4 4 8-8M15 7h6v6', mas: 'M4 6h16M4 12h16M4 18h16',
  };
  const icono = (n) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('aria-hidden', 'true'); const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', ICONOS[n]); s.append(p); return s; };
  raiz.UI = { h, num, dinero, corto, pct, hoy, fechaCorta, lunes, masDias, diasEntre, barra, nombreConcepto, aviso, icono };
})(window);
</script>
<script>// id: core.datos · tipo: proceso_base · módulo: core · deps: acceso.servicio
// Única puerta a la base de datos. Todo pasa por aquí (fácil de probar y de cambiar).
(function (raiz) {
  function crearDatos(sb) {
    const revisar = ({ data, error }) => { if (error) throw new Error(error.message || 'Error de base de datos'); return data; };
    return {
      async listar(tabla, filtro, orden) {
        let q = sb.from(tabla).select('*');
        for (const [k, v] of Object.entries(filtro || {})) q = Array.isArray(v) ? q.in(k, v) : q.eq(k, v);
        for (const o of orden || []) q = q.order(o.replace(/^-/, ''), { ascending: !o.startsWith('-') });
        return revisar(await q);
      },
      async crear(tabla, fila) { return revisar(await sb.from(tabla).insert(fila).select().single()); },
      async cambiar(tabla, id, cambios) { return revisar(await sb.from(tabla).update(cambios).eq('id', id).select().single()); },
      async borrar(tabla, id) { revisar(await sb.from(tabla).delete().eq('id', id)); },
      async rpc(fn, args) { return revisar(await sb.rpc(fn, args)); },
    };
  }
  if (typeof module !== 'undefined') module.exports = { crearDatos }; else raiz.crearDatos = crearDatos;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// id: reporte.resumen · tipo: regla_calculo · módulo: reporte · deps: reporte.gastado_vs_avance
// Totales de la obra a partir de las filas de reporte_conceptos.
(function (raiz) {
  function resumenObra(filas) {
    const n = (x) => Number(x || 0);
    const presupuesto = filas.reduce((s, f) => s + n(f.presupuesto), 0);
    const comprometido = filas.reduce((s, f) => s + n(f.comprometido), 0);
    const pagado = filas.reduce((s, f) => s + n(f.pagado), 0);
    // Avance físico ponderado por importe; gastado = comprometido + pagado sobre presupuesto.
    const avance = presupuesto > 0 ? filas.reduce((s, f) => s + n(f.presupuesto) * n(f.pct_avance), 0) / presupuesto : 0;
    const gastado = presupuesto > 0 ? (100 * (comprometido + pagado)) / presupuesto : 0;
    const alertas = filas.filter((f) => f.alerta);
    return { presupuesto, comprometido, pagado, avance, gastado, alertas };
  }
  if (typeof module !== 'undefined') module.exports = { resumenObra }; else raiz.resumenObra = resumenObra;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// id: core.app · tipo: proceso_base · módulo: core · deps: core.datos, ui.ayudas, todas las pantallas
// Estructura: encabezado, contenido, menú inferior y botón +. Solo se arma después del login.
(function (raiz) {
  const { h, aviso, icono } = raiz.UI;
  raiz.PANTALLAS = raiz.PANTALLAS || {};
  const MENU = [['inicio', 'Inicio'], ['conceptos', 'Conceptos'], ['gastos', 'Gastos'], ['avances', 'Avance', 'avance'], ['mas', 'Más']];

  function iniciarApp(cont, datos, opciones) {
    const ctx = { datos, obra: null, cache: {}, ir, recargar, aviso, acceso: opciones.acceso };
    let vista = 'inicio', params = {};
    const top = h('header', { class: 'top' }), cuerpo = h('section', { class: 'cuerpo' });
    const nav = h('nav', { class: 'nav', 'aria-label': 'Menú' }, h('div', { class: 'nav-in' }, MENU.map(([id, txt, ic]) =>
      h('button', { 'data-ir': id, onclick: () => ir(id) }, icono(ic || id), txt))));
    const menuFab = h('div', { class: 'menu-fab', hidden: true },
      h('button', { onclick: () => ir('gasto_nuevo') }, '+ Gasto'),
      h('button', { onclick: () => ir('avances', { registrar: true }) }, '+ Avance'),
      h('button', { onclick: () => ir('sueldos') }, '+ Sueldo'),
      h('button', { onclick: () => ir('fotos', { agregar: true }) }, '+ Foto'));
    const fab = h('button', { class: 'fab', 'aria-label': 'Agregar', onclick: () => { menuFab.hidden = !menuFab.hidden; } }, '+');
    cont.replaceChildren(h('div', { class: 'app' }, top, cuerpo), menuFab, fab, nav);

    // Lo que cambia poco se guarda en memoria y se refresca al guardar algo.
    ctx.conceptos = async () => (ctx.cache.conceptos ||= await datos.listar('conceptos', { obra_id: ctx.obra.id }, ['orden', 'clave', 'creado']));
    ctx.listas = async (lista) => (ctx.cache['l_' + lista] ||= await datos.listar('listas', { lista, activo: true }, ['orden', 'valor']));
    ctx.olvidar = () => { ctx.cache = {}; };

    async function elegirObra() {
      const obras = await datos.listar('obras', {}, ['creado']);
      let guardada = null; try { guardada = localStorage.getItem('obraActiva'); } catch (e) { /* sin almacenamiento */ }
      ctx.obra = obras.find((o) => o.id === guardada) || obras[obras.length - 1] || null;
      return obras;
    }
    ctx.usarObra = (o) => { ctx.obra = o; ctx.olvidar(); try { localStorage.setItem('obraActiva', o.id); } catch (e) { /* sin almacenamiento */ } };

    async function ir(v, p) {
      vista = v; params = p || {}; menuFab.hidden = true;
      const base = v === 'gasto_nuevo' ? 'gastos' : ['reporte', 'sueldos', 'bitacora', 'calendario', 'fotos', 'estimaciones', 'obra'].includes(v) ? 'mas' : v;
      nav.querySelectorAll('[data-ir]').forEach((b) => b.classList.toggle('on', b.dataset.ir === base));
      if (!ctx.obra && v !== 'obra') { vista = 'obra'; params = { nueva: true }; }
      fab.hidden = !ctx.obra || ['obra', 'mas', 'gasto_nuevo'].includes(vista);
      nav.hidden = !ctx.obra;
      const pantalla = raiz.PANTALLAS[vista];
      cuerpo.replaceChildren(h('p', { class: 'vacio' }, 'Cargando…'));
      try {
        const r = await pantalla(ctx, params);
        top.replaceChildren(h('small', {}, r.sub || (ctx.obra ? ctx.obra.nombre : '')), h('h1', {}, r.titulo));
        cuerpo.replaceChildren(...[].concat(r.contenido).flat(Infinity).filter(Boolean));
        document.dispatchEvent(new CustomEvent('pantalla', { detail: vista }));
      } catch (e) {
        top.replaceChildren(h('h1', {}, 'Error'));
        cuerpo.replaceChildren(h('div', { class: 'c alerta' }, h('div', { class: 'b rojo' }, 'No se pudo cargar'), h('div', { class: 'mu' }, e.message)), h('button', { class: 'btn o2', onclick: () => ir(vista, params) }, 'Reintentar'));

    const det = es.length ? await ctx.datos.listar('estimacion_conceptos', { estimacion_id: es.map((e) => e.id) }) : [];
    const avs = cs.length ? await ctx.datos.listar('avances', { concepto_id: cs.map((c) => c.id) }) : [];
    const presupuesto = cs.reduce((s, c) => s + num(c.importe), 0);
    const cerradas = es.filter((e) => e.estado !== 'borrador'), borrador = es.find((e) => e.estado === 'borrador');
    const acumAntes = (fin) => { const m = {}; det.filter((d) => cerradas.some((e) => e.id === d.estimacion_id && e.periodo_fin < fin)).forEach((d) => { m[d.concepto_id] = (m[d.concepto_id] || 0) + num(d.cantidad); }); return m; };

        filas.length ? h('div', { class: 'c tabla', style: 'padding:6px 8px' }, h('table', {}, h('thead', {}, h('tr', {}, ['Concepto', 'Anterior', 'Este', 'Acum.', 'Importe'].map((t) => h('th', { scope: 'col' }, t)))),
          h('tbody', {}, filas.map((f) => h('tr', {}, h('td', {}, nombreConcepto(f.c)), h('td', {}, pct(f.ant)), h('td', {}, pct(f.este)), h('td', { class: 'b' }, pct(f.ant + f.este)), h('td', {}, dinero(f.imp))))))) : h('p', { class: 'vacio' }, 'Sin avances en este periodo.'),
        msg, h('button', { class: 'btn', disabled: !filas.some((f) => f.cant > 0), onclick: (e) => { if (e.currentTarget.dataset.seguro) return cerrar(); e.currentTarget.dataset.seguro = '1'; e.currentTarget.textContent = '¿Seguro? Toca otra vez'; } }, 'Cerrar periodo')];

<script>
(function () {
  const sb = window.crearClienteSupabase(window.CONFIG);
  const a = window.crearAcceso(sb, { minutosBloqueo: window.CONFIG.minutosBloqueoInactividad });
  const datos = window.crearDatos(sb);
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $('msg').textContent = t || ''; };
  let dentroAntes = false;

    document.querySelectorAll('[data-vista]').forEach((d) => { d.hidden = d.dataset.vista !== e; });
    $('acceso').hidden = e === 'dentro';

      else window.UI.aviso('Entraste con ' + a.metodo());
      dentroAntes = true;
    } else if (e === 'fuera') { app.replaceChildren(); app.hidden = true; dentroAntes = false; } // nada de la app existe sin login
    else { app.hidden = true; } // bloqueada: se oculta; al desbloquear vuelve donde estaba
  }

    const n = await a.contarPasskeys(), el = $('huellas');

  }

  $('btnPasskey').onclick = $('btnPasskey2').onclick = () => r(a.entrarConPasskey());
  $('btnEnlace').onclick = () => r(a.enviarEnlace($('correo').value.trim()));

  $('app').addEventListener('click', async (ev) => {
