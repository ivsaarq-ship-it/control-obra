<script>// id: acceso.servicio · tipo: servicio_externo · módulo: acceso · deps: core.configuracion

window.crearClienteSupabase = function (cfg) {

<script>// id: acceso.reglas · tipo: regla_calculo · módulo: acceso · deps: acceso.servicio
// Estados: 'fuera' (sin sesión) → passkey o enlace por correo (una sola vez por celular; la sesión queda guardada).
//          'bloqueada' (hay sesión pero la app se bloqueó) → passkey o PIN.
//          'dentro' → se ve la app. Ninguna pantalla sin 'dentro'.
(function (raiz) {
  const esFallaDeRed = (e) => (typeof navigator !== 'undefined' && navigator.onLine === false) || /failed to fetch|network|load failed|fetch|timeout|conexi/i.test(String((e && e.message) || e));
  // Pide la huella/Face ID del teléfono con la passkey ya registrada (no necesita internet).
  async function huellaLocal() {
    if (!(raiz.navigator && raiz.navigator.credentials && raiz.PublicKeyCredential)) return false;
    const c = await raiz.navigator.credentials.get({ publicKey: { challenge: raiz.crypto.getRandomValues(new Uint8Array(32)), userVerification: 'required', timeout: 60000 } });
    return !!c;
  }
  function crearAcceso(sb, opciones) {
    const o = Object.assign({ minutosBloqueo: 15, ahora: () => Date.now(), verificarLocal: huellaLocal, almacen: (() => { try { return raiz.localStorage; } catch (e) { return null; } })() }, opciones || {});
    const CLAVE = 'ultimoUso';
    const leerUso = () => { try { return Number(o.almacen && o.almacen.getItem(CLAVE)) || 0; } catch (e) { return 0; } };
    const guardarUso = (t) => { try { if (o.almacen) { if (t) o.almacen.setItem(CLAVE, String(t)); else o.almacen.removeItem(CLAVE); } } catch (e) { /* sin almacenamiento */ } };
    // Bloqueo con huella/PIN: apagado por defecto (dueño: "déjalo libre con la opción de poderle poner contraseña más adelante").
    const pideClave = () => { if (typeof o.pedirClave === 'function') return !!o.pedirClave(); try { return !!o.almacen && o.almacen.getItem('pedirClave') === '1'; } catch (e) { return false; } };
    const tokenGuardado = () => { try { const s = o.almacen; if (!s) return false; for (let i = 0; i < s.length; i++) if (/^sb-.*-auth-token$/.test(s.key(i))) return true; } catch (e) { /* nada */ } return false; };
    const vencido = (t) => pideClave() && o.ahora() - t > o.minutosBloqueo * 60000;
    let estado = 'fuera', ultimoUso = 0, metodo = '';
    const escuchas = [];
    const poner = (e) => { estado = e; if (e === 'dentro') { ultimoUso = o.ahora(); guardarUso(ultimoUso); } escuchas.forEach((f) => f(e)); };
    const error = (e, porDefecto) => ({ ok: false, mensaje: (e && e.message) || porDefecto });

    return {
      estado: () => estado,
      metodo: () => metodo,
      alCambiar: (f) => escuchas.push(f),
      puedeVer: () => estado === 'dentro',
      pideClave,
      ponerPedirClave(si) { try { if (o.almacen) { if (si) o.almacen.setItem('pedirClave', '1'); else o.almacen.removeItem('pedirClave'); } } catch (e) { /* sin almacenamiento */ } if (estado === 'dentro') { ultimoUso = o.ahora(); guardarUso(ultimoUso); } },

      // urlActual: si viene del enlace del correo, entra directo.
      async iniciar(urlActual) {
        const vieneDeEnlace = /access_token=|[?&]code=/.test(urlActual || '');
        let data = null;
        try { data = (await Promise.race([sb.auth.getSession(), new Promise((_, mal) => setTimeout(() => mal(new Error('timeout')), o.esperaSesion || 8000))])).data; }
        catch (e) { data = { session: tokenGuardado() ? {} : null }; } // sin respuesta: si hay sesión guardada en el celular, se entra
        const haySesion = !!(data && data.session);
        let conQueDesbloquear = true;
        const usoReciente = haySesion && (!pideClave() || (leerUso() > 0 && !vencido(leerUso())));
        if (haySesion && !vieneDeEnlace && !usoReciente && sb.auth.passkey && sb.auth.passkey.list) {
          // Sin huella registrada no hay con qué desbloquear: entra para que pueda configurarla.
          try { const r = await sb.auth.passkey.list(); conQueDesbloquear = !!(r && r.data && r.data.length); } catch (e) { conQueDesbloquear = true; }
        }
        metodo = vieneDeEnlace ? 'correo' : 'sesión guardada';
        poner(haySesion ? (vieneDeEnlace || usoReciente || !conQueDesbloquear ? 'dentro' : 'bloqueada') : 'fuera'); // sesión guardada: pide huella o PIN solo tras el tiempo sin uso
        sb.auth.onAuthStateChange((ev, ses) => { if (!ses) poner('fuera'); });
        return estado;
      },

      async entrarConPasskey() {
        let res; try { res = await sb.auth.signInWithPasskey(); } catch (x) { res = { error: x }; }
        const { data, error: e } = res || {};
        // Sin señal y con la sesión ya guardada: basta la huella del teléfono para quitar el bloqueo de pantalla.
        if (e && estado === 'bloqueada' && esFallaDeRed(e)) {
          try { if (await o.verificarLocal()) { metodo = 'huella (sin señal)'; poner('dentro'); return { ok: true }; } } catch (x) { /* canceló */ }
          return { ok: false, mensaje: 'Sin señal: no se pudo verificar la huella' };
        }
        if (e || !data || !data.session) return error(e, 'No se pudo entrar con huella/Face ID');
        metodo = 'huella'; poner('dentro'); return { ok: true };
      },

      async enviarEnlace(correo) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo || '')) return { ok: false, mensaje: 'Correo no válido' };
        const { error: e } = await sb.auth.signInWithOtp({
          email: correo, options: { shouldCreateUser: false, emailRedirectTo: raiz.location ? raiz.location.href.split('#')[0] : undefined },
        });
        return e ? error(e, 'No se pudo enviar el enlace') : { ok: true, mensaje: 'Revisa tu correo' };
      },

      async entrarConPin(pin) {
        if (estado !== 'bloqueada') return { ok: false, mensaje: 'El PIN solo desbloquea; primero entra con huella o correo' };
        if (!/^\d{6}$/.test(pin || '')) return { ok: false, mensaje: 'El PIN tiene 6 dígitos' };
        const { data, error: e } = await sb.rpc('verificar_pin', { p_pin: pin });
        if (e) return error(e, 'Error al verificar PIN');
        if (data.ok) { metodo = 'PIN'; poner('dentro'); return { ok: true }; }
        if (data.motivo === 'bloqueado') return { ok: false, mensaje: 'Bloqueado 15 min por 5 intentos fallidos' };
        if (data.motivo === 'sin_pin') return { ok: false, mensaje: 'No tienes PIN configurado' };
        return { ok: false, mensaje: `PIN incorrecto. Quedan ${data.restantes} intentos` };
      },

      async contarPasskeys() {
        try { const r = await sb.auth.passkey.list(); return r && r.data ? r.data.length : null; } catch (e) { return null; }
      },

      async registrarPasskey() {
        if (estado !== 'dentro') return { ok: false, mensaje: 'Primero entra' };
        try {
          const { error: e } = await sb.auth.registerPasskey();
          return e ? error(e, 'No se pudo registrar') : { ok: true };
        } catch (e) { return error(e, 'No se pudo registrar'); }
      },

      async fijarPin(pin) {
        if (estado !== 'dentro') return { ok: false, mensaje: 'Primero entra' };
        if (!/^\d{6}$/.test(pin || '')) return { ok: false, mensaje: 'El PIN tiene 6 dígitos' };
        const { error: e } = await sb.rpc('fijar_pin', { p_pin: pin });
        return e ? error(e, 'No se pudo guardar el PIN') : { ok: true };
      },

      // Llamar en cada interacción; si pasó el tiempo, bloquea.
      revisarInactividad() {
        if (estado === 'dentro' && vencido(ultimoUso)) poner('bloqueada');
        else if (estado === 'dentro') { ultimoUso = o.ahora(); guardarUso(ultimoUso); }
        return estado;
      },

      bloquear() { if (estado === 'dentro' && pideClave()) poner('bloqueada'); },
      // Sale siempre en pantalla, aunque el servidor tarde o falle; borra la sesión guardada del teléfono.
      async salir() {
        metodo = ''; poner('fuera'); guardarUso(0);
        try { await Promise.race([sb.auth.signOut({ scope: 'local' }), new Promise((r) => setTimeout(r, 3000))]); } catch (e) { /* ya está fuera */ }
        try { const ls = raiz.localStorage; if (ls) Object.keys(ls).filter((k) => k.startsWith('sb-')).forEach((k) => ls.removeItem(k)); } catch (e) { /* sin almacenamiento */ }
      },
    };
  }
  if (typeof module !== 'undefined') module.exports = { crearAcceso }; else raiz.crearAcceso = crearAcceso;

// Dictado con el reconocimiento de voz del propio Chrome (gratis). Ojo: Chrome manda el audio a Google para pasarlo a texto,
// igual que el micrófono del teclado. La app solo recibe el texto.
(function (raiz) {
  const Rec = () => raiz.SpeechRecognition || raiz.webkitSpeechRecognition;

    disponible: () => !!Rec(),
    // Llamar dentro del toque del usuario. alParcial recibe el texto mientras hablas.
    escuchar(alParcial) {
      return new Promise((ok, mal) => {
        const C = Rec(); if (!C) return mal(new Error('Este navegador no permite dictar. Usa Chrome.'));
        const r = new C(); let final = '', parcial = '';
        r.lang = 'es-MX'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
        r.onresult = (e) => { parcial = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) final += t; else parcial += t; } if (alParcial) alParcial((final + ' ' + parcial).trim()); };
        r.onerror = (e) => mal(new Error(e.error === 'not-allowed' ? 'Da permiso al micrófono' : e.error === 'no-speech' ? 'No te escuché' : 'No se pudo dictar (' + e.error + ')'));
        r.onend = () => { const t = (final || parcial).trim(); t ? ok(t) : mal(new Error('No te escuché')); };
        raiz.VOZ.parar = () => { try { r.stop(); } catch (e) { /* ya paró */ } };
        r.start();
      });
    },
    parar() {},
  };
})(window);
</script>

<script>// id: estimaciones.pantalla · tipo: pantalla · módulo: estimaciones · deps: estimaciones.esquema, avances.esquema, conceptos.esquema
// Estimación = lo ejecutado en el periodo × precio unitario. Al cerrar, se congela por concepto.

  raiz.PANTALLAS.estimaciones = async (ctx) => {
    const obra = ctx.obra.id;
    const [es, cs] = await Promise.all([ctx.datos.listar('estimaciones', { obra_id: obra }, ['-numero']), ctx.conceptos()]);
    const det = es.length ? await ctx.datos.listar('estimacion_conceptos', { estimacion_id: es.map((e) => e.id) }) : [];
    const avs = cs.length ? await ctx.datos.listar('avances', { concepto_id: cs.map((c) => c.id) }) : [];
    const presupuesto = cs.reduce((s, c) => s + num(c.importe), 0);
    const cerradas = es.filter((e) => e.estado !== 'borrador'), borrador = es.find((e) => e.estado === 'borrador');
    const acumAntes = (fin) => { const m = {}; det.filter((d) => cerradas.some((e) => e.id === d.estimacion_id && e.periodo_fin < fin)).forEach((d) => { m[d.concepto_id] = (m[d.concepto_id] || 0) + num(d.cantidad); }); return m; };

      const este = {}; avs.filter((a) => a.fecha >= borrador.periodo_inicio && a.fecha <= borrador.periodo_fin).forEach((a) => { este[a.concepto_id] = (este[a.concepto_id] || 0) + num(a.cantidad); });

        return { c, ant: (100 * (ant[c.id] || 0)) / q, este: (100 * (este[c.id] || 0)) / q, cant: este[c.id] || 0, imp: Math.round((este[c.id] || 0) * num(c.precio_unitario) * 100) / 100 }; });

          h('tbody', {}, filas.map((f) => h('tr', {}, h('td', {}, nombreConcepto(f.c)), h('td', {}, pct(f.ant)), h('td', {}, pct(f.este)), h('td', { class: 'b' }, pct(f.ant + f.este)), h('td', {}, dinero(f.imp))))))) : h('p', { class: 'vacio' }, 'Sin avances en este periodo.'),
        msg, h('button', { class: 'btn', disabled: !filas.some((f) => f.cant > 0), onclick: (e) => { if (e.currentTarget.dataset.seguro) return cerrar(); e.currentTarget.dataset.seguro = '1'; e.currentTarget.textContent = '¿Seguro? Toca otra vez'; } }, 'Cerrar periodo')];

        h('div', { class: 'grid2' }, h('label', {}, 'Del', h('input', { name: 'inicio', type: 'date', value: ini, required: true })), h('label', {}, 'Al', h('input', { name: 'fin', type: 'date', value: hoy() > ini ? hoy() : ini, required: true }))),
        msg, h('button', { class: 'btn', type: 'submit' }, 'Crear borrador'));

<script>// id: core.respaldo · tipo: proceso_base · módulo: core · deps: core.datos, fotos.drive
// Copia de todos los datos en el Drive del dueño (carpeta "Control de obra - respaldos"), un archivo por respaldo.
// Automático cada 7 días si Google ya dio permiso; si no, botón "Respaldar ahora" (Inicio avisa y Más).
(function (raiz) {
  const TABLAS = ['obras', 'listas', 'conceptos', 'personas', 'gastos', 'destajos', 'sueldos', 'avances', 'estimaciones', 'estimacion_conceptos', 'fotos', 'tareas', 'tarea_dependencias', 'bitacora_notas', 'cobros'];

    for (const t of TABLAS) tablas[t] = await datos.listar(t, {});

  }
  raiz.RESPALDO = {
    TABLAS, armar,
    ultimo: leer,

    // Al abrir la app: solo si ya toca y Google ya dio permiso (no abre ventanas).
